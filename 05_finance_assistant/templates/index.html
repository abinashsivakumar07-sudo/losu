function esc(v){return v.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));}
function add(role,text){const e=document.createElement("div");e.className="msg "+role;e.innerHTML='<div class="msg-role">'+(role==="user"?"YOU":"ASSISTANT")+'</div><div>'+esc(text)+'</div>';messages.appendChild(e);messages.scrollTop=messages.scrollHeight;}
async function load(){try{const r=await fetch("/api/history");const d=await r.json();messages.innerHTML="";if(!d.messages.length)add("assistant",window.APP_CONFIG.welcome_message);d.messages.forEach(m=>add(m.role,m.content));}catch(e){messages.innerHTML="";add("assistant",window.APP_CONFIG.welcome_message);}}
form.addEventListener("submit",async e=>{e.preventDefault();const text=input.value.trim();if(!text){input.focus();return}input.value="";input.style.height="auto";add("user",text);typing.hidden=false;input.disabled=true;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");add("assistant",d.answer);}catch(err){add("assistant",err.message||"Something went wrong. Please try again.");}finally{typing.hidden=true;input.disabled=false;input.focus();}});
